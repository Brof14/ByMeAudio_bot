name: Python checks

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax
        run: python -m compileall -q app bot.py tests
      - name: Critical lint rules
        run: ruff check .
      - name: Unit tests
        run: pytest -q
